name: Bump aws-mountpoint-s3-csi-driver add-on version (in cijenkinsio-agents-2)

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  getClusterKubernetesVersion:
    kind: hcl
    name: Retrieve the Kubernetes version used in the EKS cluster
    spec:
      file: eks-cijenkinsio-agents-2.tf
      path: module.cijenkinsio_agents_2.kubernetes_version

  getLatestAwsS3CsiDriverVersion:
    kind: shell
    name: Retrieve the latest version of aws-mountpoint-s3-csi-driver for Kubernetes {{ source "getClusterKubernetesVersion" }}
    dependson:
      - getClusterKubernetesVersion
    spec:
      command: |
        ./get-addon-versions.sh {{ source "getClusterKubernetesVersion" }} aws-mountpoint-s3-csi-driver
      environments:
          - name: PATH
          - name: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY

targets:
  upgradeAwsS3CsiDriverVersion:
    name: Update the aws-mountpoint-s3-csi-driver addon version in locals-data.yaml
    kind: yaml
    sourceid: getLatestAwsS3CsiDriverVersion
    spec:
      file: locals-data.yaml
      key: $.'cijenkinsio-agents-2'.eks_addons.aws_s3_csi_driver
    scmid: default

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: Bump aws-mountpoint-s3-csi-driver add-on version (in cijenkinsio-agents-2) to {{ source "getLatestAwsS3CsiDriverVersion" }}
    spec:
      labels:
        - dependencies
        - eks-addons
