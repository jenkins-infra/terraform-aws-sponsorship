name: Bump AMI release version for EKS managed node groups in terraform-aws-sponsorship/locals-data.yaml

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  getClusterKubernetesVersion:
    kind: hcl
    name: Retrieve the Kubernetes version used in the EKS cluster
    spec:
      file: eks-cijenkinsio-agents-2.tf
      path: module.cijenkinsio_agents_2.kubernetes_version

  getLatestAmiReleaseVersion:
    kind: shell
    name: Retrieve the ami_release_version version for Kubernetes {{ source "getClusterKubernetesVersion" }}
    dependson:
      - getClusterKubernetesVersion
    spec:
      command: ./get-ami-release-versions.sh {{ source "getClusterKubernetesVersion" }} ami_release
      environments:
        - name: PATH
        - name: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY

targets:
  upgradeAMIVersion:
    name: Update the AMI release version in terraform-aws-sponsorship/locals-data.yaml
    kind: yaml
    sourceid: getLatestAmiReleaseVersion
    spec:
      file: locals-data.yaml
      key: $.'cijenkinsio-agents-2'.eks_ami_release_version
    scmid: default

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: Bump AMI release version for EKS managed node groups to {{ source "getLatestAmiReleaseVersion" }}
    spec:
      labels:
        - dependencies
        - eks-ami-release
